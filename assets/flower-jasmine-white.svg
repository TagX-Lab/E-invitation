    <path d="M50 50 Q43 18 50 10 Q57 18 50 50 Z" fill="url(#jasminePetal)" transform="rotate(135 50 50)"/>
    <path d="M50 50 Q43 18 50 10 Q57 18 50 50 Z" fill="url(#jasminePetal)" transform="rotate(180 50 50)"/>
    <path d="M50 50 Q43 18 50 10 Q57 18 50 50 Z" fill="url(#jasminePetal)" transform="rotate(225 50 50)"/>
    <path d="M50 50 Q43 18 50 10 Q57 18 50 50 Z" fill="url(#jasminePetal)" transform="rotate(270 50 50)"/>
    <path d="M50 50 Q43 18 50 10 Q57 18 50 50 Z" fill="url(#jasminePetal)" transform="rotate(315 50 50)"/>
    
    <circle cx="50" cy="50" r="7" fill="url(#jasmineCenter)"/>
    <circle cx="50" cy="50" r="3" fill="#ffd54f"/>
