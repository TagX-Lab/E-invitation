<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="jasminePetal" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#fdfbf7"/>
      <stop offset="90%" stop-color="#ece4d0"/>
      <stop offset="100%" stop-color="#d7caa9"/>
    </radialGradient>
    <radialGradient id="jasmineCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe57f"/>
      <stop offset="70%" stop-color="#8bc34a"/>
      <stop offset="100%" stop-color="#4caf50"/>
    </radialGradient>
    <filter id="jShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#4a3e28" flood-opacity="0.25"/>
    </filter>
