<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="roseGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff1744"/>
      <stop offset="40%" stop-color="#d50000"/>
      <stop offset="75%" stop-color="#880e4f"/>
      <stop offset="100%" stop-color="#4a0017"/>
    </radialGradient>
    <linearGradient id="roseCurl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8da1" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#d50000" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#4a0017" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="roseShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-color="#2a0008" flood-opacity="0.4"/>
    </filter>
  </defs>
  <g filter="url(#roseShadow)">
    <!-- Natural Rose Petal Outline -->
    <path d="M50 8 C68 6 92 24 88 54 C85 76 65 92 50 94 C35 92 15 76 12 54 C8 24 32 6 50 8 Z" fill="url(#roseGrad)"/>
    <!-- Curled Edge Highlight -->
    <path d="M50 8 C62 7 80 18 82 34 C76 22 60 14 50 14 C40 14 24 22 18 34 C20 18 38 7 50 8 Z" fill="url(#roseCurl)"/>
    <!-- Subtle Petal Vein -->
    <path d="M50 16 Q51 52 50 86" stroke="#ff5252" stroke-width="1.2" stroke-linecap="round" opacity="0.35"/>
  </g>
</svg>
